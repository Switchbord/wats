name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Bun tests and release hygiene
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wats_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: wats_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U wats_test -d wats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package artifacts for workspace import tests
        run: bun run build:packages

      - name: Run tests
        env:
          WATS_TEST_POSTGRES_URL: postgresql://wats_test:local-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/wats_test
        run: bun test

      - name: Confirm real Postgres regression executes
        env:
          WATS_TEST_POSTGRES_URL: postgresql://wats_test:local-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/wats_test
        run: bun test packages/persistence/tests/postgresRealConcurrency.test.ts

      - name: Run minimal bot example smoke
        run: bun run examples:minimal-bot

      - name: Run webhook echo bot example smoke
        run: bun run examples:webhook-echo-bot

      - name: Typecheck publishable packages
        run: bun run typecheck

      - name: Typecheck full source tree (all packages, Bun runtime types)
        run: bun run typecheck:full

      - name: Banned-phrase markdown gate
        run: bun site/scripts/check-banned-phrases-markdown.ts

      - name: Check publishability guard
        run: bun run check-publish

      - name: Playground asset freshness gate
        run: |
          cd site/playground-build
          bun install --frozen-lockfile
          bun run bundle.ts
          cd ../..
          (cd site && bun scripts/gen-playground-assets.ts)
          git diff --exit-code -- site/public/playground/
